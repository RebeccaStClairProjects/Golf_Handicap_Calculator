<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Golfer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/golfer.css') }}">
</head>
<body data-mode="addGolfer">
    <div class="page-wrapper">
        <!-- Header + Brand -->
        <header class="site-header">
            <div class="brand">
                <!-- Gold badge with circular crop of your logo -->
                <span class="brand__logo" aria-hidden="true">
                    <img src="{{ url_for('static', filename='img/PoloParkLogo.png') }}"
                         alt="Polo Park East round seal"
                         class="brand__logo-image" />
                </span>

                <!-- Words live outside the circle: use text (recommended) -->
                <h1 class="brand__title">
                    Polo Park East — Men's Club Handicap System
                </h1>
            </div>
        </header>

        <!-- Navigation Bar -->
        <nav class="navbar" aria-label="Primary">
            <div class="nav">
                <a href="#" class="is-active">Add Golfer</a>
                <a href="{{ url_for('addRound') }}">Add Round</a>
                <a href="#">Update Handicap Metrix</a>
                <a href="{{ url_for('printMemberHandicaps') }}">Print Member Handicaps</a>
            </div>
        </nav>

        <main class="container">
            <section class="card" id="addGolferCard">
                <h1>Add New Golfer</h1>
                <div id="nameCheckStatus" class="helper" aria-live="polite"></div>

                <form id="addGolferForm" class="round-form" autocomplete="off">
                    <fieldset id="addGolferFields">
                        <div class="form-row two-col">
                            <div>
                                <label for="firstName">First Name</label>
                                <input id="firstName" name="firstName" class="input" type="text"
                                       placeholder="a-z . - ' allowed" required>
                            </div>
                            <div>
                                <label for="lastName">Last Name</label>
                                <input id="lastName" name="lastName" class="input" type="text"
                                       placeholder="a-z . - ' allowed" required>
                            </div>
                        </div>

                        <label for="preExistingInformation">Does this golfer already have existing handicap information?</label>
                        <select class="input" id="preExistingInformation" name="preExistingInformation">
                            <option value="False" selected>No</option>
                            <option value="True">Yes</option>
                        </select>

                        <div id="ExistingInformation" class="form-row for-col" hidden>
                            <div class="extra-info" hidden>
                                <label for="handicap">Handicap</label>
                                <input id="handicap" type="number" name="handicap" step="0.01">
                            </div>

                            <div class="extra-info" hidden>
                                <label for="roundsPlayed">Number of Rounds Played</label>
                                <input id="roundsPlayed" type="number" name="roundsPlayed">
                            </div>

                            <div class="extra-info" hidden>
                                <label for="seasonTotal">Current Total for Season</label>
                                <input id="seasonTotal" type="number" name="seasonTotal">
                            </div>

                            <div class="extra-info" hidden>
                                <label for="roundAvg">Average Per Round</label>
                                <input id="roundAvg" type="number" name="roundAvg" step="0.01">
                            </div>
                        </div>
                    </fieldset>

                    <button class="btn" id="saveGolferBtn" type="submit">Save Golfer</button>
                </form>
            </section>

            <section class="card" id="golferSavedCard" hidden>
                <h1>Golfer Saved</h1>
                <div id="golferSavedMessage" class="helper" aria-live="polite"></div>
                <div class="table-wrap">
                    <table class="member-table">
                        <tbody>
                            <tr>
                                <th>Golfer ID</th>
                                <td id="savedGolferID">-</td>
                            </tr>
                            <tr>
                                <th>Name</th>
                                <td id="savedGolferName">-</td>
                            </tr>
                            <tr>
                                <th>Handicap</th>
                                <td id="savedGolferHandicap">-</td>
                            </tr>
                            <tr>
                                <th>Rounds Played</th>
                                <td id="savedGolferRoundsPlayed">-</td>
                            </tr>
                            <tr>
                                <th>Round Average</th>
                                <td id="savedGolferRoundAvg">-</td>
                            </tr>
                            <tr>
                                <th>Season Total</th>
                                <td id="savedGolferSeasonTotal">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <br />
                <button class="btn" id="addAnotherGolferBtn" type="button">Add Another Golfer</button>
            </section>
        </main>


    <footer class="site-footer">
        Admin tools for member handicaps.
    </footer>

    <div id="existingGolferModal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="existingGolferTitle">
            <h2 id="existingGolferTitle">Golfer Already Exists</h2>
            <p id="existingGolferMessage"></p>
            <div class="modal-actions">
                <button id="tryDifferentNameBtn" class="candidate-btn" type="button">Try Different Name</button>
                <button id="proceedToRoundBtn" class="btn" type="button">Proceed to Add Round</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/addGolferForm.js') }}"></script>
    </div>
</body>
</html>
